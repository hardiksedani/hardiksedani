  <rect x="51" y="235" width="132" height="34" rx="8" fill="#082a35" stroke="#0891b2"/><text x="117" y="256" fill="#67e8f9">AI / AGENTS</text>
  <rect x="195" y="235" width="136" height="34" rx="8" fill="#101f3c" stroke="#3b82f6"/><text x="263" y="256" fill="#93c5fd">FULL-STACK</text>
  <rect x="343" y="235" width="126" height="34" rx="8" fill="#241a3f" stroke="#8b5cf6"/><text x="406" y="256" fill="#c4b5fd">SECURITY</text>
</g>
<rect x="650" y="43" width="500" height="236" rx="16" fill="url(#panel)" stroke="#34445e" stroke-width="1.2"/>
<path d="M650 83H1150" stroke="#34445e"/><circle cx="674" cy="63" r="5" fill="#fb7185"/><circle cx="692" cy="63" r="5" fill="#fbbf24"/><circle cx="710" cy="63" r="5" fill="#34d399"/>
<text x="900" y="67" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle" fill="#8798b7">SYSTEMS / IN PROGRESS</text>
<g font-family="Consolas,Monaco,monospace" font-size="14">
  <text x="675" y="113" fill="#5f718e">01</text><text x="711" y="113" fill="#67e8f9">const</text><text x="757" y="113" fill="#e5e7eb"> builder = {</text>
  <text x="675" y="145" fill="#5f718e">02</text><text x="711" y="145" fill="#c4b5fd">focus:</text><text x="773" y="145" fill="#fcd34d"> "real problems",</text>
  <text x="675" y="177" fill="#5f718e">03</text><text x="711" y="177" fill="#c4b5fd">stack:</text><text x="773" y="177" fill="#fcd34d"> ["AI", "web", "security"],</text>
  <text x="675" y="209" fill="#5f718e">04</text><text x="711" y="209" fill="#c4b5fd">loop:</text><text x="773" y="209" fill="#fcd34d"> "learn → build → refine"</text>
  <text x="675" y="241" fill="#5f718e">05</text><text x="711" y="241" fill="#e5e7eb">};</text>
</g>
<rect x="676" y="255" width="448" height="4" rx="2" fill="#1e293b"/><rect x="676" y="255" width="273" height="4" rx="2" fill="url(#glow)"/>
<rect x="1" y="1" width="1198" height="328" rx="21" fill="none" stroke="#4b5f85" stroke-opacity=".45"/>
