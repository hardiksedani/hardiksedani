<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Hardik Sedani — Build. Ship. Secure.</title><desc id="desc">A dark neon developer banner with AI systems, full-stack products, and application security themes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d18"/><stop offset=".55" stop-color="#10152a"/><stop offset="1" stop-color="#17102d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#182338"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".08" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
</defs>
<rect width="1200" height="330" rx="22" fill="url(#bg)"/><rect width="1200" height="330" rx="22" fill="url(#grid)"/>
<circle cx="1035" cy="55" r="155" fill="#7c3aed" opacity=".19" filter="url(#blur)"/><circle cx="875" cy="300" r="135" fill="#0891b2" opacity=".13" filter="url(#blur)"/>
<g stroke="url(#glow)" stroke-width="1.6" fill="none" opacity=".75"><path d="M0 265H110L155 220H360"/><circle cx="360" cy="220" r="4" fill="#22d3ee"/><path d="M1200 88H1100L1065 123H1005"/><circle cx="1005" cy="123" r="4" fill="#a78bfa"/><path d="M812 0V34L840 62V91"/></g>
<rect x="48" y="35" width="294" height="28" rx="14" fill="#0e1a2a" stroke="#31415c"/>
<circle cx="65" cy="49" r="4" fill="#2dd4bf"/><text x="80" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2" fill="#a9bad2">HARDIK SEDANI / ENGINEERING LOG</text>
<text x="48" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="51" font-weight="750" fill="#f8fafc">Hey, I'm Hardik <tspan fill="#fbbf24">👋</tspan></text>
<text x="51" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#e7eefb">AI &amp; Data Science · Full-Stack Builder · Security Enthusiast</text>
<text x="51" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#a8bad3">Building practical software across AI, web, automation, and security.</text>
